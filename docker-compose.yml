services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?Заполните DB_USERNAME в .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Заполните DB_PASSWORD в .env}
      POSTGRES_DB: ${DB_NAME:?Заполните DB_NAME в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуется: бот ходит в БД по внутренней сети compose.
    # Чтобы подключиться к БД с сервера (например, через SSH-туннель), раскомментируйте:
    # ports:
    #   - "127.0.0.1:5433:5432"
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
